seen_expire_days = 90

[settings.scoring]
keywords_high = ["claude code", "mcp", "model context protocol", "agentic coding", "vibe coding", "context engineering", "harness engineering", "guardrail", "swe-bench", "alignment", "red team", "ai safety"]
keywords_mid = ["agent", "benchmark", "evaluation", "fine-tuning", "rag", "prompt engineering", "code review", "rust", "cargo", "tokio", "coding agent", "copilot", "cursor", "windsurf", "devin"]

